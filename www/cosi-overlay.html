<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;background:transparent;overflow:hidden;pointer-events:none}#cosi{position:fixed;left:8px;bottom:6px}#cosi{background:none;border:0;box-shadow:none;border-radius:0;width:84px;height:106px;font-size:0;animation:none;overflow:visible}
#cosi i,#cosi u{display:none}#cosi svg{display:block;overflow:visible}#cosi .cf{display:block;transform-origin:50% 100%}
#cosi .bk,#cosi .a2,#cosi .a3,#cosi .a4,#cosi .mt,#cosi .mk,#cosi .mx,#cosi .sg,#cosi .zz,#cosi .dts,#cosi .sp,#cosi .eyc,#cosi .eyx,#cosi .br{display:none}
#cosi.s1 .bk,#cosi.s2 .a2,#cosi.s3 .a3,#cosi.s4 .a4{display:inline}
#cosi.m-happy .sg{display:inline}#cosi.m-happy .eyes{display:none}
#cosi.m-tired .mt,#cosi.m-tired .eyc,#cosi.m-tired .zz{display:inline}#cosi.m-tired .eyes,#cosi.m-tired .mc{display:none}
#cosi.m-think .mk,#cosi.m-think .dts,#cosi.m-think .br{display:inline}#cosi.m-think .mc{display:none}
#cosi.m-excited .mx,#cosi.m-excited .eyx,#cosi.m-excited .sp{display:inline}#cosi.m-excited .eyes,#cosi.m-excited .mc{display:none}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.025)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes earw{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-9deg)}94%{transform:rotate(5deg)}}
@keyframes earw2{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(9deg)}94%{transform:rotate(-5deg)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}
@keyframes stepL{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hopb{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes jump{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes waveA{0%,100%{transform:rotate(0)}50%{transform:rotate(-150deg)}}
@keyframes armsL{from{transform:rotate(0)}to{transform:rotate(150deg)}}
@keyframes armsR{from{transform:rotate(0)}to{transform:rotate(-150deg)}}
@keyframes zf{0%{opacity:0;transform:translateY(6px)}50%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
@keyframes dt{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes sp{from{opacity:.3;transform:scale(.8)}to{opacity:1;transform:scale(1.15)}}
#cosi .bd{transform-origin:50px 120px;animation:breathe 3.2s ease-in-out infinite}
#cosi .eyes{transform-origin:50px 52px;animation:blink 4.5s infinite}
#cosi .el{transform-origin:40px 38px;animation:earw 7s infinite}#cosi .er{transform-origin:60px 38px;animation:earw2 7s infinite;animation-delay:.3s}
#cosi .st{transform-origin:66px 90px;animation:sway 2.6s ease-in-out infinite}
#cosi .la{transform-origin:30px 86px}#cosi .ra{transform-origin:70px 86px}#cosi .lf,#cosi .rf{transform-origin:50px 117px}
#cosi .zz text{animation:zf 2.4s infinite}#cosi .dts circle{animation:dt 1.2s infinite}#cosi .dts circle:nth-child(2){animation-delay:.2s}#cosi .dts circle:nth-child(3){animation-delay:.4s}#cosi .sp text{animation:sp .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#cosi.m-tired .bd{animation-duration:5.5s}#cosi.m-tired .el{animation:none;transform:rotate(-38deg)}#cosi.m-tired .er{animation:none;transform:rotate(38deg)}
#cosi.m-excited .bd{animation:jump .7s ease-in-out infinite}#cosi.m-excited .la{animation:armsL .5s ease-in-out infinite alternate}#cosi.m-excited .ra{animation:armsR .5s ease-in-out infinite alternate}
#cosi.wave .ra{animation:waveA .5s ease-in-out 4}
#cosi.walk .lf{animation:stepL .36s infinite}#cosi.walk .rf{animation:stepL .36s infinite;animation-delay:.18s}#cosi.walk .bd{animation:hopb .36s infinite}#cosi.walk .st{animation-duration:.5s}#cosi.walk{animation:none}
@media (prefers-reduced-motion:reduce){#cosi *{animation:none!important}}

#cosi{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#cosi .nc{display:none}
@keyframes dangle{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
@keyframes dance{0%,100%{transform:translateX(-5px) rotate(-6deg)}50%{transform:translateX(5px) rotate(6deg)}}
@keyframes snore{0%,100%{transform:rotate(0) scaleY(1)}50%{transform:rotate(3deg) scaleY(1.04)}}
#cosi.held{z-index:30}#cosi.held svg{transform:scale(1.12) translateY(-4px)}#cosi.held .bd{animation:none}#cosi.held .la{animation:none;transform:rotate(150deg)}#cosi.held .ra{animation:none;transform:rotate(-150deg)}#cosi.held .lf{animation:dangle .5s ease-in-out infinite alternate}#cosi.held .rf{animation:dangle .5s ease-in-out infinite alternate-reverse}#cosi.held .mc,#cosi.held .mx,#cosi.held .mt{display:none}#cosi.held .mk{display:inline}
#cosi.dance .bd{animation:dance .5s ease-in-out infinite}#cosi.dance .la{animation:armsL .4s ease-in-out infinite alternate}#cosi.dance .ra{animation:armsR .4s ease-in-out infinite alternate;animation-delay:.2s}#cosi.dance .lf{animation:stepL .25s infinite}#cosi.dance .rf{animation:stepL .25s infinite;animation-delay:.12s}#cosi.dance .mx,#cosi.dance .eyx,#cosi.dance .sp{display:inline}#cosi.dance .eyes,#cosi.dance .mc,#cosi.dance .sg,#cosi.dance .mt,#cosi.dance .eyc,#cosi.dance .zz,#cosi.dance .mk,#cosi.dance .dts{display:none}
#cosi.sleeping .nc,#cosi.sleeping .eyc,#cosi.sleeping .zz,#cosi.sleeping .mt{display:inline}#cosi.sleeping .eyes,#cosi.sleeping .eyx,#cosi.sleeping .sg,#cosi.sleeping .mc,#cosi.sleeping .mk,#cosi.sleeping .mx,#cosi.sleeping .sp,#cosi.sleeping .dts{display:none}#cosi.sleeping .el{animation:none;transform:rotate(-38deg)}#cosi.sleeping .er{animation:none;transform:rotate(38deg)}#cosi.sleeping .bd{animation:snore 4s ease-in-out infinite}

</style></head><body>

<script>
var A=document.getElementById('cosi');
function setWalk(on,dir){A.classList[on?'add':'remove']('walk');document.querySelector('.cf').style.transform='scaleX('+(dir||1)+')'}
function setHeld(on){A.classList[on?'add':'remove']('held')}
function setSleep(on){A.classList[on?'add':'remove']('sleeping')}
function setMood(m,s){A.className=A.className.replace(/\b(m-\w+|s\d)\b/g,'').replace(/\s+/g,' ').trim()+' m-'+m+' s'+s}
function dance(){A.classList.add('dance');setTimeout(function(){A.classList.remove('dance')},4000)}
</script></body></html>
